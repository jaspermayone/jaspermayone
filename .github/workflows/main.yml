# .github/workflows/main.yml

name: update readme

on:
  push:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  markscribe:
    # Skip on pushes by any "jasperbot" variant
    if: github.event_name != 'push' || (
      !contains(github.actor, 'jasperbot') &&
      !contains(github.actor, '🤖'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          # No go.mod or go.sum in this repo, so there is nothing to cache.
          cache: false

      - name: install markscribe
        run: go install github.com/taciturnaxolotl/markscribe@HEAD

      - name: generate readme
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKATIME_URL: ${{ secrets.WAKATIME_URL }}
        run: |
          "$(go env GOPATH)/bin/markscribe" -write README.md templates/README.md.tpl

      - uses: stefanzweifel/git-auto-commit-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: Update generated README
          branch: main
          commit_user_name: jasperbot[markscribe] 🤖
          commit_user_email: robot+github@jaspermayone.com
          commit_author: jasperbot 🤖 <robot+github@jaspermayone.com>
